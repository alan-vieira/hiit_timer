[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: Unit tests for pure logic (workout, store)
    ui: UI tests using Flet TestView
    integration: Integration tests between controller and view
    slow: Tests that take > 1 second
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning