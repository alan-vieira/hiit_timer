[project]
name = "hiit-timer"
version = "2.2.0"
description = "Cronômetro HIIT simples e funcional"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flet==0.86.5",
    "flet-audio>=0.1.0",
    "wakepy>=0.7.0",
]

[tool.pylint.main]
# Ignora falsos positivos comuns do Flet (kwargs dinâmicos, membros não resolvidos)
disable = [
    "E1123",
    "E1121",
    "E1101",
    "R0913",
    "R0915",
    "C0114",
    "C0115",
    "C0116",
]

[tool.pylint.format]
max-line-length = 120

[tool.black]
line-length = 120
target-version = ['py312']

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.isort]
profile = "black"
line_length = 120
